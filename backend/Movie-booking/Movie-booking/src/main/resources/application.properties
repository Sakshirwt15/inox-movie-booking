spring.application.name=Movie-booking

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/final}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Spring Security / JWT ----------
# Must be a Base64 string of at least 32 bytes. Set JWT_SECRET in production.
security.jwt.secret-key=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
# 10h in milliseconds
security.jwt.expiration-time=36000000

# ---------- Image upload ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
project.image=images/

# ---------- Logging ----------
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ---------- Server port ----------
server.port=${PORT:8081}

# ---------- Mail ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your@gmail.com}
spring.mail.password=${MAIL_PASSWORD:app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true